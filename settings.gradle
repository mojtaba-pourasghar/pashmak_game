pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // Cafe Bazaar's billing library (Poolakey) is only published here.
        maven {
            url 'https://jitpack.io'
            content { includeGroupByRegex 'com\\.github\\.cafebazaar.*' }
        }
    }
}

rootProject.name = "Pashmak Game"
include ':app'
