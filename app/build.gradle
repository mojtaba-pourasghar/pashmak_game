plugins {
    id 'com.android.application'
}

/*
 * Bazaar's in-app billing RSA public key (developer panel -> In-App Billing).
 * It is read from local.properties, which is not committed:
 *
 *     bazaar.rsaKey=MIHNMA0GCSqGSIb3DQEBAQUAA4G7ADCBtwKBrwD...
 *
 * or from -PbazaarRsaKey=... on a build server. Purchases are verified against it
 * on the device, so a release build refuses to go out without one.
 */
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def bazaarRsaKey = (localProps.getProperty('bazaar.rsaKey')
        ?: project.findProperty('bazaarRsaKey') ?: '').toString().trim()
if (bazaarRsaKey.isEmpty()) {
    logger.warn('Pashmak: bazaar.rsaKey is not set in local.properties; '
            + 'purchases will not be signature-checked in debug builds.')
}
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { it.project == project && it.name.contains('Release') }
    if (releasing && bazaarRsaKey.isEmpty()) {
        throw new GradleException('Set bazaar.rsaKey in local.properties before building a release.')
    }
}

android {
    namespace 'com.pashmak.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.pashmak.app"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        vectorDrawables.useSupportLibrary = true
        resourceConfigurations += ['fa', 'en']

        buildConfigField 'String', 'BAZAAR_RSA_KEY', "\"${bazaarRsaKey}\""
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def cameraxVersion = '1.3.4'
    def lifecycleVersion = '2.8.7'
    def roomVersion = '2.6.1'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycleVersion"

    implementation "androidx.room:room-runtime:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"

    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"

    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Cafe Bazaar in-app billing. The library is Kotlin; its callbacks are Kotlin
    // function types (kotlin.Unit etc.), so the standard library has to be on the
    // compile classpath — Poolakey only declares it for runtime. A newer stdlib
    // brought in by AndroidX wins the resolution, which is fine.
    implementation 'com.github.cafebazaar.Poolakey:poolakey:2.3.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
